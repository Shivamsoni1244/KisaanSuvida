<!DOCTYPE html>
<html lang="en">
<head>
<title>{% if lang == 'hi' %}सिफारिश त्रुटि{% else %}Recommendation Warning{% endif %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --green-deep:#1a4d2e; --green-mid:#2e7d4f; --green-bright:#4caf73; --gold:#f5c842; --border:#c8e6c9; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height: 100vh; background: #e8f5e9;
    font-family: 'Nunito', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 28px 20px;
  }
  .card {
    background: white; border-radius: 24px; padding: 44px 36px;
    max-width: 440px; width: 100%;
    box-shadow: 0 20px 60px rgba(200,80,80,0.12), 0 0 0 1.5px #ffcdd2;
    text-align: center;
    animation: riseIn 0.6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes riseIn { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
  .icon { font-size: 4rem; margin-bottom: 16px; display: block; }
  .title { font-size: 1.5rem; font-weight: 900; color: #c62828; margin-bottom: 12px; }
  .msg {
    background: #fff5f5; border: 2px solid #ffcdd2; border-radius: 14px;
    padding: 16px 20px; font-size: 0.95rem; color: #555; font-weight: 600;
    line-height: 1.7; margin-bottom: 28px; text-align: left;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px;
    background: linear-gradient(135deg, var(--green-bright), var(--green-mid));
    color: white; border-radius: 14px; text-decoration: none;
    font-size: 1rem; font-weight: 900;
    box-shadow: 0 8px 24px rgba(46,125,79,0.35);
    transition: 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }

  /* ── Language Toggle ── */
  .lang-toggle {
    display: flex; align-items: center;
    background: white; border: 1.5px solid var(--border);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(46,125,79,0.10);
    flex-shrink: 0;
  }
  .lang-toggle a {
    padding: 7px 14px; text-decoration: none;
    font-size: 0.82rem; font-weight: 900;
    color: #aaa; transition: 0.2s;
    white-space: nowrap;
  }
  .lang-toggle a.active {
    background: linear-gradient(135deg, var(--green-bright), var(--green-mid));
    color: white; border-radius: 28px;
    margin: 2px;
  }
  .lang-toggle a:not(.active):hover { color: var(--green-mid); }

</style>
</head>
<body>
<div style="position:fixed;top:14px;right:14px;z-index:100;">
  <div class="lang-toggle">
    <a href="/set_lang?lang=en" class="{% if lang != 'hi' %}active{% endif %}">EN</a>
    <a href="/set_lang?lang=hi" class="{% if lang == 'hi' %}active{% endif %}">हि</a>
  </div>
</div>
<div class="card">
  <span class="icon">⚠️</span>
  <div class="title">{% if lang == 'hi' %}सिफारिश संभव नहीं{% else %}Prediction Blocked{% endif %}</div>
  <div class="msg">{{ error_msg }}</div>
  <a href="/crop_page" class="btn">← {% if lang == 'hi' %}पुनः प्रयास करें{% else %}Try Again{% endif %}</a>
</div>
</body>
</html>
