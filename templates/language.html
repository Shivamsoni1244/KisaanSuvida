<!DOCTYPE html>
<html lang="en">
<head>
<title>Kisan Suvidha - Select Language</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1a4d2e;
    --green-mid: #2e7d4f;
    --green-bright: #4caf73;
    --gold: #f5c842;
    --cream: #fdf8f0;
    --text-dark: #1a2e1a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height: 100vh;
    background: #e8f5e9;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* SVG Nature Background */
  .bg-illustration {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  /* Animated field rows */
  .bg-illustration::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 60% 0%, rgba(76,175,115,0.30) 0%, transparent 55%),
      radial-gradient(ellipse at 10% 90%, rgba(245,200,66,0.13) 0%, transparent 55%),
      linear-gradient(180deg, #c8e6c9 0%, #e8f5e9 40%, #f1f8e9 100%);
  }

  /* SVG wheat field bottom */
  .field-svg {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* Sun glow */
  .sun-glow {
    position: fixed;
    top: -120px;
    right: -80px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(245,200,66,0.35) 0%, rgba(245,200,66,0.10) 40%, transparent 70%);
    border-radius: 50%;
    z-index: 1;
    animation: pulseSun 5s ease-in-out infinite;
  }
  @keyframes pulseSun {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }

  /* Floating leaf icons */
  .leaf {
    position: fixed;
    font-size: 2.2rem;
    opacity: 0.18;
    animation: floatUp linear infinite;
    z-index: 1;
  }
  @keyframes floatUp {
    from { transform: translateY(105vh) rotate(0deg); }
    to   { transform: translateY(-10vh) rotate(25deg); }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    background: white;
    border-radius: 32px;
    padding: 52px 48px 48px;
    width: 460px;
    max-width: 94vw;
    box-shadow: 0 24px 80px rgba(46,125,79,0.18), 0 0 0 1.5px rgba(76,175,115,0.18);
    animation: riseIn 0.7s cubic-bezier(.16,1,.3,1) both;
    text-align: center;
  }
  @keyframes riseIn {
    from { opacity:0; transform:translateY(40px) scale(0.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--green-mid), var(--green-bright));
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 8px 24px rgba(46,125,79,0.35);
  }
  .logo-text {
    font-family: 'Yatra One', cursive;
    font-size: 2.3rem;
    color: var(--green-deep);
    letter-spacing: 0.5px;
  }

  .tagline {
    font-size: 0.92rem;
    color: #7a9a7a;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .divider {
    width: 70px;
    height: 4px;
    background: linear-gradient(90deg, var(--green-mid), var(--gold));
    border-radius: 2px;
    margin: 16px auto 32px;
  }

  .choose-label {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text-dark);
    margin-bottom: 22px;
    line-height: 1.5;
  }

  .lang-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 30px;
  }

  .lang-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 22px 14px;
    border: 2.5px solid #d0ecd8;
    border-radius: 20px;
    background: #f6fdf8;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .lang-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--green-bright), var(--green-mid));
    opacity: 0;
    transition: opacity 0.25s;
    border-radius: 18px;
  }
  .lang-btn:hover::after { opacity: 1; }
  .lang-btn:hover { border-color: var(--green-mid); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(46,125,79,0.22); }
  .lang-btn:hover .lang-flag,
  .lang-btn:hover .lang-name,
  .lang-btn:hover .lang-native { color: white !important; }

  .lang-flag { font-size: 2.2rem; position: relative; z-index: 1; }
  .lang-name { font-size: 1.15rem; font-weight: 900; color: var(--green-deep); position: relative; z-index: 1; transition: color 0.25s; }
  .lang-native { font-size: 0.88rem; color: #7a9a7a; position: relative; z-index: 1; font-weight: 700; transition: color 0.25s; }

  /* Kisan illustration strip */
  .illustration-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 22px;
    padding: 14px 20px;
    background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
    border-radius: 16px;
    border: 1.5px solid #c8e6c9;
  }
  .strip-item { font-size: 1.6rem; }
  .strip-text {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--green-mid);
    letter-spacing: 0.5px;
    padding: 0 8px;
  }

  .footer-note {
    font-size: 0.82rem;
    color: #aaa;
    margin-top: 6px;
  }
  .footer-note span { color: var(--green-mid); font-weight: 800; }

  .support-btn {
    position: fixed; bottom: 24px; right: 24px;
    background: linear-gradient(135deg, var(--green-mid), var(--green-deep));
    color: white; padding: 13px 22px;
    border-radius: 50px; text-decoration: none;
    font-size: 15px; font-weight: 800;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 100; transition: 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .support-btn:hover { transform: translateY(-2px) scale(1.04); }

  /* ── Language Toggle ── */
  .lang-toggle {
    display: flex; align-items: center;
    background: white; border: 1.5px solid var(--border);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(46,125,79,0.10);
    flex-shrink: 0;
  }
  .lang-toggle a {
    padding: 7px 14px; text-decoration: none;
    font-size: 0.82rem; font-weight: 900;
    color: #aaa; transition: 0.2s;
    white-space: nowrap;
  }
  .lang-toggle a.active {
    background: linear-gradient(135deg, var(--green-bright), var(--green-mid));
    color: white; border-radius: 28px;
    margin: 2px;
  }
  .lang-toggle a:not(.active):hover { color: var(--green-mid); }

</style>
</head>
